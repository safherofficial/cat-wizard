name: Cat Wizard WebGL

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cat-wizard-pages
  cancel-in-progress: false

jobs:
  build-webgl:
    name: Build WebGL player
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-CatWizard-WebGL-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-CatWizard-WebGL-${{ runner.os }}-

      - name: Build WebGL with Unity 6.3
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: WebGL
          buildName: CatWizardWebGL
          buildsPath: build

      - name: Verify generated WebGL player
        run: |
          test -s build/CatWizardWebGL/index.html
          test -d build/CatWizardWebGL/Build
          test -n "$(find build/CatWizardWebGL/Build -maxdepth 1 -type f | head -n 1)"

      - name: Upload downloadable WebGL build
        uses: actions/upload-artifact@v4
        with:
          name: cat-wizard-webgl
          path: build/CatWizardWebGL
          if-no-files-found: error
          retention-days: 14

      - name: Package GitHub Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/CatWizardWebGL

  deploy-pages:
    name: Publish browser game
    if: github.ref == 'refs/heads/main'
    needs: build-webgl
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v5

      - name: Deploy WebGL player
        id: deployment
        uses: actions/deploy-pages@v4
